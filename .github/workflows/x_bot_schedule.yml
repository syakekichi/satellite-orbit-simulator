name: SatViewer3D X Bot Automation

on:
  schedule:
    # 4時間ごとに自動実行 (UTC 0:00, 4:00, 8:00, 12:00, 16:00, 20:00)
    # JST(日本時間): 09:00, 13:00, 17:00, 21:00, 01:00, 05:00
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch: # GitHubのWeb画面から「Run workflow」でいつでも手動テスト実行可能

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & System Dependencies
        run: |
          python -m playwright install chromium --with-deps

      - name: Restore X Authentication Session
        env:
          X_AUTH_JSON: ${{ secrets.X_AUTH_JSON }}
        run: |
          python -c "import os, sys; content = os.environ.get('X_AUTH_JSON', '').strip(); sys.exit('Error: X_AUTH_JSON secret is empty!') if not content else open('auth.json', 'w', encoding='utf-8').write(content)"

      - name: Run Master Satellite Bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python bot_master.py

      - name: Upload Debug Screenshots & Card Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-debug-screenshots
          path: |
            post_card.png
            before_click_post.png
            after_click_post.png
            error_screenshot.png
            login_error.png
            account_access_error.png
          if-no-files-found: ignore
